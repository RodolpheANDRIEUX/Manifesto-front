name: Sync to GitLab

on:
  push:
    branches: ['**']  # toutes les branches

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/RodolpheANDRIEUX/Manifesto-front.git
          git push gitlab --all
          git push gitlab --tags